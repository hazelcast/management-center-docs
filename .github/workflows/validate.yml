name: Docs validation

on:
  pull_request:
    branches: [main, 'v/*', archived-versions]
  workflow_dispatch:

jobs:
  validate-docs:
    # Ignore automated release PR branches
    if: ${{ !startsWith(github.head_ref, 'update_antora_') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Current Repo
        uses: actions/checkout@v7
      - name: Validate Docs
        uses: hazelcast/hazelcast-docs-tools/.github/actions/validate-docs@actions/v1
